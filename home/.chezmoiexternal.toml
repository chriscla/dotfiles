    url = "https://github.com/blimmer/zsh-aws-vault/archive/288857c99792d648132b5f8b1227312878a769e4.tar.gz"
    exact = true
    stripComponents = 1
    exclude = ["*.md", ".gitignore", ".github/**"]
{{ end }}
{{ end -}}
