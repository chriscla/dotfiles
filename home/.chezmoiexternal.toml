    url = "https://github.com/alker0/chezmoi.vim/archive/7a498ea65f658993237fb0469001bdf71f68cf94.tar.gz"
    exact = true
    stripComponents = 1
    exclude = ["*.md", ".gitignore", ".github/**"]
{{ if .work }}
[".oh-my-zsh/custom/plugins/zsh-aws-vault"]
